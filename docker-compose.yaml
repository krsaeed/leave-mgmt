services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-local
    environment:
      POSTGRES_DB: leavemgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - leavemgmt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: leavemgmt:1.0
    container_name: leavemgmt-app
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/leavemgmt
      DB_USER: postgres
      DB_PASS: yourpassword
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leavemgmt-network

volumes:
  postgres-data:

networks:
  leavemgmt-network:
    driver: bridge